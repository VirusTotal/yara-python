name: Publish Python distribution to PyPI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Build wheels on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
            build-sdist: true
          - os: ubuntu-24.04
            arch: i686
          - os: ubuntu-24.04
            arch: aarch64
          - os: macos-15
            arch: x86_64 arm64
            env: MACOSX_DEPLOYMENT_TARGET=15.0
          - os: macos-14
            arch: x86_64 arm64
            env: MACOSX_DEPLOYMENT_TARGET=14.0
          - os: windows-2022
            arch: x86
            before: vcpkg install openssl:x86-windows-static
            env: LIB="C:\\vcpkg\\packages\\openssl_x86-windows-static\\lib" INCLUDE="C:\\vcpkg\\packages\\openssl_x86-windows-static\\include"
          - os: windows-2022
            arch: AMD64
            before: vcpkg install openssl:x64-windows-static
            env: LIB="C:\\vcpkg\\packages\\openssl_x64-windows-static\\lib" INCLUDE="C:\\vcpkg\\packages\\openssl_x64-windows-static\\include"
          - os: windows-11-arm
            arch: ARM64
            before: vcpkg install openssl:arm64-windows-static
            env: LIB="C:\\vcpkg\\packages\\openssl_arm64-windows-static\\lib" INCLUDE="C:\\vcpkg\\packages\\openssl_arm64-windows-static\\include"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          persist-credentials: false

      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: all

      - name: Build wheels
        uses: pypa/cibuildwheel@faf86a6ed7efa889faf6996aa23820831055001a # v2.23.3
        with:
          output-dir: dist
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-* cp315-*"
          CIBW_BEFORE_ALL_LINUX: |
            if [[ ! -z "$(which yum)" ]]; then
              yum install -y make gcc perl-core pcre-devel wget zlib-devel git automake
              wget https://github.com/openssl/openssl/releases/download/OpenSSL_1_1_1w/openssl-1.1.1w.tar.gz
              tar xf openssl*.gz
              cd openssl*
              ./config --prefix=/usr --openssldir=/etc/ssl zlib-dynamic
              make -j$(nproc)
              make install
            elif [[ ! -z "$(which apk)" ]]; then
              apk add openssl-dev
            fi
          CIBW_BEFORE_ALL_WINDOWS: ${{ matrix.before }}
          CIBW_BUILD_FRONTEND: "build; args: --config-setting=--enable-openssl"  
          CIBW_ENVIRONMENT: ${{ matrix.env }}
          CIBW_TEST_SKIP: "*-macosx_arm64 *-macosx_x86_64"
          CIBW_TEST_COMMAND: python {package}/tests.py

      - name: Store the distribution packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-package-distributions-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.whl

      - name: Build Sdist
        if: ${{ matrix.build-sdist }}
        run: pipx run build --sdist

      - name: Store the source distribution package
        if: ${{ matrix.build-sdist }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-package-distributions-source
          path: dist/*.tar.gz

  publish-to-pypi:
    needs: [build]
    runs-on: ubuntu-latest

    # Only publish to PyPI on tag pushes
    if: startsWith(github.ref, 'refs/tags/')

    environment:
      name: pypi
      url: https://pypi.org/p/yara-python
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: python-package-distributions-*
          merge-multiple: true
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
